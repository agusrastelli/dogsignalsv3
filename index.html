/* Match approved desktop composition; keep app shell at tablet widths. */
#dogapp{grid-template-columns:18.5% minmax(0,1fr);min-height:680px;border:0;border-radius:0;font-size:16px;line-height:1.4}

#dogapp .crumb{font-size:13px;margin:0 0 18px;padding-right:75px}

#dogapp h2{font-size:26px;font-weight:800;line-height:1.12;letter-spacing:-.04em}
#dogapp h3{font-weight:800;letter-spacing:-.03em}
#dogapp .box{border:1.5px solid #1a1a1a;border-radius:11px;padding:16px}
#dogapp .hero{grid-template-columns:minmax(0,1fr) 27%;min-height:258px;padding:21px 20px 17px;margin:20px 0 20px;gap:10px}
#dogapp .hero h2{font-size:28px;line-height:1.13;margin:0 0 9px}

#dogapp .route .badge{grid-column:1 / -1;justify-self:start;align-self:end;font-size:11px;padding:4px 10px;letter-spacing:.015em}

#dogapp .route:last-child .badge{background:#f0d7ff}
#dogapp .strip{border:1.5px solid #1a1a1a;border-radius:11px;margin-top:14px;padding:14px 18px;min-height:66px}

#dogapp .split{grid-template-columns:43% minmax(0,1fr);gap:23px}

#dogapp .explain{font-size:15px;line-height:1.45;border-radius:8px;padding:14px}
#dogapp .steps{gap:12px;margin:17px 0 14px;align-items:center}
#dogapp .steps li{border-radius:999px;padding:5px 15px;font-size:14px;display:flex;gap:12px;align-items:center;min-width:104px}
#dogapp .steps .step-num{display:inline-grid;place-items:center;border:1px solid currentColor;border-radius:50%;width:26px;height:26px;flex-shrink:0}

#dogapp .steps li[aria-current=step] .step-num{background:#034f46;color:#fff;border-color:#034f46}
#dogapp .takeaway{font-size:17px;margin-top:18px;padding-top:17px}
#dogapp .link{min-height:34px;font-size:14px}
#dogapp .credit{font-size:12px}
#dogapp .placeholder{min-height:340px;border:0;border-radius:7px;background:#e4e4d8}
#dogapp .placeholder svg{width:55px;height:55px;stroke-width:1.5}
#dogapp .option{padding:14px 12px;min-height:68px;font-size:16px;border-radius:9px}
#dogapp .draftnote{font-size:12px}

#dogapp .q{font-weight:700;margin:20px 0 8px}

#dogapp .ob-points{list-style:none;padding:0;margin:4px 0 20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#dogapp .ob-points li{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--soft-line);border-radius:999px;background:#fff;font-size:15px}
#dogapp .ob-points svg{width:18px;height:18px;color:#034f46}
#dogapp .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
#dogapp .chip{border:1px solid var(--control-line);background:#fffffa;border-radius:999px;padding:9px 16px;min-height:44px;font-size:15px!important;line-height:1.3!important;text-align:left}
#dogapp .chip:hover{background:#f5edf8}
#dogapp .chip[aria-pressed=true],#dogapp .chip[aria-pressed=true] *{background:#034f46;border-color:#034f46;color:#fff!important;-webkit-text-fill-color:#fff!important}
#dogapp .field{display:block;margin:18px 0 0}
#dogapp .field>span{display:block;font-weight:700;margin-bottom:6px}
#dogapp input[type=text]{width:100%;border:1px solid var(--control-line);border-radius:10px;padding:11px 14px;min-height:48px}
#dogapp .photo-row{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
#dogapp .file-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative}
#dogapp .file-btn:focus-within{outline:3px solid #034f46;outline-offset:4px}
#dogapp .file-btn svg{width:18px;height:18px}
#dogapp .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:#f0d7ff;border:1px solid #85708d;flex-shrink:0}
#dogapp .avatar svg{width:56%;height:56%}
#dogapp .avatar.md{width:72px;height:72px}
#dogapp .avatar.lg{width:128px;height:128px;border-width:2px}
#dogapp img.avatar{background:#e4e4d0}
#dogapp #dog-profile{margin-top:auto}
#dogapp .side-profile{display:flex;align-items:center;gap:10px;padding:14px 6px 0;border-top:1px solid var(--soft-line)}
#dogapp .side-profile strong{display:block;font-size:15px;line-height:1.2}
#dogapp .side-profile .link{min-height:30px!important;padding:2px 0;font-size:14px!important}
#dogapp .hello{display:flex;align-items:center;gap:18px;margin:20px 0 4px}
#dogapp .hello h1{margin:0}
#dogapp .section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 15px}
#dogapp .section-head h2{margin:0}
#dogapp .mt{margin-top:32px!important}
#dogapp h2.mt{margin-bottom:15px}
#dogapp .route .why{grid-column:1/-1;align-self:end;font-size:13px!important;line-height:1.35!important;font-weight:700;color:#034f46!important}
#dogapp .routes.concepts{grid-template-columns:repeat(2,minmax(0,1fr))}
#dogapp .routes.concepts .badge{background:#fff8d6!important;border-style:dashed!important}
#dogapp .strip.personalize{margin:0 0 8px}
#dogapp .care-note{display:flex;gap:10px;align-items:flex-start;font-size:14px!important;background:#f5f5e2;border-radius:10px;padding:12px 14px;margin:12px 0 0}
#dogapp .care-note svg{flex-shrink:0;color:#034f46;margin-top:2px}
#dogapp .worked .contexts{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0 4px}
#dogapp .wsteps{list-style:none;padding:0;margin:14px 0 10px;display:grid;gap:10px}
#dogapp .wsteps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:start;padding:14px 16px;border:1px solid var(--soft-line);border-radius:10px;background:#fffffa}
#dogapp .wsteps li:last-child{background:#edf4ea;border-color:#9fbfa9}
#dogapp .wsteps .n,#dogapp .plan-list .n{width:30px;height:30px;border-radius:50%;background:#034f46;color:#fff!important;-webkit-text-fill-color:#fff!important;display:grid;place-items:center;font-weight:700;font-size:15px}
#dogapp .wsteps p{margin:0 0 4px}
#dogapp .wsteps p:last-child{margin:0}
#dogapp .label{font-size:13px!important;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#44443d!important;margin:0 0 4px}
#dogapp .plan-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
#dogapp .plan-list li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--soft-line);border-radius:10px;background:#fff}
#dogapp .plan-list p{margin:2px 0 0}
#dogapp details.hint{border:1px solid var(--soft-line);border-radius:10px;padding:8px 14px;margin:0 0 18px;background:#fffffa}
#dogapp details.hint ol{margin:10px 0 4px;padding-left:20px}
#dogapp .inline-feedback{border-left:4px solid #034f46;background:#edf4ea;padding:14px 16px;border-radius:8px;margin-top:14px}
#dogapp .inline-feedback.miss{border-left-color:#b35900;background:#fff3e0}
#dogapp .inline-feedback p{margin:6px 0 0}
#dogapp fieldset:disabled .option{opacity:.8!important}
#dogapp .steps li.done{border-color:#034f46}
#dogapp .result-card{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px;background:#edf4ea}
#dogapp .result-card p{margin:0}
#dogapp .score-big{font:800 44px/1.05 'Bricolage Grotesque',Arial,sans-serif!important;letter-spacing:-.03em;margin:4px 0!important}
#dogapp .result-code{max-width:290px}
#dogapp .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;background:#fff;border:1px solid var(--soft-line);padding:6px 12px;border-radius:8px;display:inline-block;margin:4px 0 6px}
#dogapp .sound-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
#dogapp .sound-list li{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--soft-line);border-radius:10px;background:#fffffa}
#dogapp .sound-list p{margin:0}
#dogapp .play{width:44px;height:44px;border-radius:50%;background:#e4e4d0;display:grid;place-items:center;flex-shrink:0}
#dogapp .play svg{width:18px;height:18px}
#dogapp .chip-static{display:inline-block;border:1px dashed var(--control-line);border-radius:999px;padding:6px 12px;font-size:14px;margin:0 6px 6px 0;background:#fff}
#dogapp .fake-input{border:1px solid var(--control-line);border-radius:10px;padding:10px 14px;color:#56564d!important;background:#fff;margin-bottom:14px}
#dogapp .interest{margin-top:16px}
#dogapp .interest h3{margin-bottom:12px}
#dogapp .table-wrap{overflow-x:auto;border:1px solid var(--soft-line);border-radius:10px;margin:16px 0}
#dogapp table.log{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
#dogapp table.log th,#dogapp table.log td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--soft-line);white-space:nowrap}
#dogapp table.log th{background:#f5f5e2;font-weight:700}
@media(max-width:850px){#dogapp .worked .contexts{grid-template-columns:1fr}#dogapp .routes.concepts{grid-template-columns:1fr}}
@media(max-width:600px){#dogapp .side-profile{display:none}#dogapp .ob-card{padding:22px 18px}#dogapp .ob h1{font-size:27px}#dogapp .hello{align-items:flex-start}#dogapp .hello .avatar.md{width:56px;height:56px}#dogapp .result-card{display:block}#dogapp .result-code{margin-top:14px}}
@media (prefers-reduced-motion:reduce){#dogapp .ob-progress span{transition:none}}
/* Icon sizes: the base stylesheet sizes every Lucide icon from --icon-size */
#dogapp .ob-icon{--icon-size:44px}
#dogapp .ob-icon svg{color:#034f46}
#dogapp .avatar{--icon-size:22px}
#dogapp .avatar.md{--icon-size:34px}
#dogapp .avatar.lg{--icon-size:58px}
#dogapp .ob-points,#dogapp .file-btn,#dogapp .play,#dogapp .care-note{--icon-size:18px}
#dogapp .placeholder{--icon-size:44px}
@media(max-width:600px){#dogapp .hello h1 br{display:none}#dogapp .hello h1{font-size:28px}}
/* Account: deferred sign-up, passwordless sign-in (prototype) */
#dogapp input[type=email]{width:100%;border:1px solid var(--control-line);border-radius:10px;padding:11px 14px;min-height:48px}
#dogapp .signin-line{text-align:center;margin:20px 0 0;font-size:15px!important}
#dogapp .signin-line .link{min-height:32px!important;padding:0 2px}
#dogapp .save-card{display:flex;gap:14px;align-items:flex-start;margin:22px 0 0;padding:16px 18px;border-radius:12px;background:#f5edf8;border:1px solid #d9c2e6;--icon-size:24px}
#dogapp .save-card svg{color:#034f46;flex-shrink:0;margin-top:2px!important}
#dogapp .save-card p{margin:4px 0 0}
#dogapp .recap-save{align-items:center;margin:0 0 16px}
#dogapp .recap-save>div{flex:1;min-width:0}
#dogapp .proto-note{display:flex;gap:10px;align-items:flex-start;font-size:14px!important;line-height:1.45!important;background:#fff8d6;border:1px dashed #b8a24a;border-radius:10px;padding:10px 12px;margin:16px 0 0;--icon-size:18px}
#dogapp .proto-note svg{flex-shrink:0;margin-top:2px!important}
#dogapp .side-account{font-size:13px!important;line-height:1.4;padding:6px 6px 0;color:#44443d!important}
#dogapp .side-account .link{min-height:28px!important;font-size:13px!important;padding:0}
#dogapp .status-banner{display:flex;gap:10px;align-items:center;background:#edf4ea;border:1px solid #9fbfa9;border-radius:10px;padding:10px 14px;margin:4px 0 0;--icon-size:20px}
#dogapp .status-banner svg{color:#034f46}
#dogapp .progress-line{display:flex;gap:8px;align-items:center;font-size:14px!important;font-weight:600;color:#034f46!important;margin:14px 0 0;--icon-size:18px}
@media(max-width:600px){#dogapp .side-account{display:none}#dogapp .recap-save{flex-wrap:wrap}}
#dogapp h1[tabindex="-1"]:focus{outline:none}

function readPhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const S=360,cv=document.createElement('canvas'),m=Math.min(img.width,img.height);cv.width=cv.height=S;cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);res(cv.toDataURL('image/jpeg',.85))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

let page='home',context='food',q=0,zoom=false,practiceZoom=false,completed=false,qShown=Date.now(),resubmits=0;

const questions=[
{title:'Notice the signal',prompt:'Which statement describes what is visible, rather than an emotion?',options:['The dog feels worried.','The tongue is reaching toward the nose.','The dog wants someone to pet it.','I’m not sure.'],correct:1,why:['Worry is an interpretation. The photo alone does not establish that feeling.','Yes. This describes a visible feature without assigning an emotion.','Wanting contact is an interpretation, not something this photo establishes.','Start with the mouth: the tongue reaches toward the nose.'],takeaway:'Observation describes what you can see. Interpretation suggests what it could mean.'},
{title:'Use the context',prompt:'Given this situation, which explanation is best supported?',options:['Expecting food is one possible explanation.','Licking proves the dog is uncomfortable.','Licking tells us nothing, even with context.','I’m not sure.'],correct:0,why:['Yes. The food-related situation supports this possibility without proving it.','The signal has more than one possible explanation; food matters in this scenario.','Context helps us weigh explanations, even when it cannot provide certainty.','The person is opening the dog’s treat container. Consider how that changes the explanation.'],takeaway:'Use the situation to weigh possibilities; do not treat one signal as proof.'},
{title:'Recognize the limits',prompt:'What can you conclude from the photo and the imagined situation?',options:['Food nearby means the dog is definitely relaxed.','A nose lick predicts what the dog will do next.','Food anticipation is plausible, but feelings and next actions are not certain.','I’m not sure.'],correct:2,why:['Food does not establish the dog’s overall emotional state.','A still image and a single cue cannot predict the next action.','Yes. You can suggest an explanation while keeping its limits clear.','It is okay to be unsure. We can still identify a plausible explanation without claiming certainty.'],takeaway:'Look at the whole body and what happens before and after the moment.'}
];
const guided={scenario:'Just before this photo, someone the dog has never met leaned over it to pat the top of its head.',prompt:'Which explanation is best supported?',options:['The dog is expecting food.','The dog may feel uneasy about being approached this way. Giving it space is a reasonable response.','The lick proves the dog is about to bite.','I’m not sure.'],correct:1,
why:['Is food part of this situation? Nothing points to food here, so this explanation has little support.','Yes. The situation (a stranger leaning over) and the lick point the same way. You can give space without being certain.','A single signal can’t predict what a dog will do next.','That’s okay. Walk through the steps: no food is involved, and the approach is one that many dogs find uncomfortable.'],
hint:['What do you see? The tongue reaches toward the nose.','What is happening around the dog? Is food involved?','Which explanation fits both the signal and the situation?']};
const W={
food:{label:'Food is being prepared',happening:'A person is preparing the dog’s meal nearby.',body:'Imagine the dog is also watching the bowl, with a loose body and a gently wagging tail.',reading:'Expecting food is a reasonable explanation.',why:'Food is involved, and the rest of the body looks loose. Both point the same way.',respond:'Nothing to change. This is an everyday moment.'},
car:{label:'Being lifted into a car',happening:'Someone is lifting the dog into a car.',body:'Imagine the dog is also holding its ears back and turning its head away.',reading:'Discomfort is a reasonable explanation.',why:'No food is involved, and other signals suggest unease. The same lick now points somewhere else.',respond:'Slow down. Pause, and give the dog a moment or some space.'},
unknown:{label:'We don’t know',happening:'You only have this photo. You don’t know what happened just before.',body:'One frame doesn’t show the whole body or what happens next.',reading:'“I need more information” is the honest answer.',why:'Without context, a lick has more than one possible explanation. Keep it open.',respond:'Look at what happened just before, and watch the rest of the body.'}};

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {

            "aria-current",
            String(position === active),

        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),

        if (event.key === "Escape" && picker.open) {
          event.preventDefault();

          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
